<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Huy Pham PRO - Tải Ảnh & Video Đa Nền Tảng</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #0a0a0a, #1a1a2e);
    color: #fff;
    min-height: 100vh;
    padding: 20px;
}
.container { max-width: 700px; margin: 0 auto; }
h1 {
    text-align: center;
    font-size: 2.2em;
    background: linear-gradient(135deg, #f59e0b, #d97706);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 5px;
}
.subtitle { text-align: center; color: #888; margin-bottom: 20px; font-size: 0.9em; }
.card {
    background: #1e1e2e;
    border-radius: 16px;
    padding: 25px;
    margin-bottom: 20px;
    border: 1px solid #333;
}
h3 { margin-bottom: 15px; font-size: 1.1em; }
input, textarea {
    width: 100%;
    padding: 14px;
    background: #2d2d3d;
    border: 2px solid #444;
    border-radius: 10px;
    color: #fff;
    font-size: 16px;
    margin-bottom: 12px;
    font-family: inherit;
}
input:focus, textarea:focus { outline: none; border-color: #8b5cf6; }
button {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #8b5cf6, #d946ef);
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s;
}
button:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(139,92,246,0.3); }
button:disabled { opacity: 0.5; cursor: not-allowed; }
.result {
    margin-top: 15px;
    padding: 20px;
    background: #2d2d3d;
    border-radius: 12px;
    display: none;
}
.result.show { display: block; }
video, img {
    width: 100%;
    border-radius: 10px;
    margin: 10px 0;
    max-height: 500px;
    background: #000;
    object-fit: contain;
}
.btn-group {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 10px;
}
.btn-green { background: #22c55e; }
.btn-blue { background: #3b82f6; }
.btn-red { background: #ef4444; }
.btn-orange { background: #f59e0b; }
.btn-purple { background: #8b5cf6; }
.platform-badge {
    display: inline-block;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 700;
    margin-bottom: 10px;
}
.badge-tiktok { background: linear-gradient(135deg, #25f4ee, #fe2c55); }
.badge-instagram { background: linear-gradient(135deg, #f58529, #dd2a7b, #8134af); }
.badge-facebook { background: #1877f2; }
.badge-unknown { background: #666; }
.status {
    padding: 12px;
    border-radius: 8px;
    margin-top: 12px;
    font-size: 14px;
    display: none;
}
.status.show { display: block; }
.status.info { background: #1e3a5f; color: #93c5fd; }
.status.error { background: #450a0a; color: #fca5a5; }
.status.success { background: #052e16; color: #86efac; }
.info-box {
    background: #1a1a2e;
    border-radius: 12px;
    padding: 15px;
    margin-bottom: 15px;
    border-left: 4px solid #8b5cf6;
    font-size: 13px;
    color: #aaa;
    line-height: 1.6;
}
.warning { border-left-color: #f59e0b; background: #2a1f0a; color: #fcd34d; }
.platforms {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-bottom: 20px;
    flex-wrap: wrap;
}
.platform-chip {
    padding: 8px 14px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    background: #2d2d3d;
    border: 1px solid #444;
}
.image-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 8px;
    margin: 10px 0;
}
.image-grid img {
    width: 100%;
    height: 120px;
    object-fit: cover;
    cursor: pointer;
    transition: transform 0.2s;
    margin: 0;
}
.image-grid img:hover { transform: scale(1.05); }
.tabs {
    display: flex;
    gap: 5px;
    margin-bottom: 20px;
    background: #1a1a2e;
    padding: 5px;
    border-radius: 12px;
    overflow-x: auto;
}
.tab {
    flex: 1;
    padding: 12px;
    background: transparent;
    color: #999;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
    font-size: 13px;
    white-space: nowrap;
    min-width: 100px;
}
.tab.active { background: #8b5cf6; color: #fff; }
.tab-content { display: none; }
.tab-content.active { display: block; }
</style>
</head>
<body>
<div class="container">
    <h1>👑 HUY PHAM PRO</h1>
    <p class="subtitle">Tải Ảnh & Video Đa Nền Tảng</p>

    <div class="platforms">
        <span class="platform-chip">🎵 TikTok</span>
        <span class="platform-chip">📷 Instagram</span>
        <span class="platform-chip">📘 Facebook</span>
    </div>

    <div class="tabs">
        <button class="tab active" onclick="showTab(event, 'download')">🔗 Tải Ảnh/Video</button>
        <button class="tab" onclick="showTab(event, 'batch')">📁 Nhiều Link</button>
    </div>

    <!-- TAB 1 -->
    <div class="tab-content active" id="tab-download">
        <div class="card">
            <h3>🔗 Dán link (ảnh hoặc video)</h3>
            <div class="info-box">
                💡 Hỗ trợ: TikTok, Instagram (Post/Reel/IGTV), Facebook. Dán link → Bấm tải → Nhận link ảnh/video trực tiếp.
            </div>
            <input type="url" id="url-input" placeholder="https://www.instagram.com/p/... hoặc /reel/...">
            <button id="btn-download" onclick="downloadMedia()">🚀 Tải Ngay</button>
            <div class="status" id="status-download"></div>
        </div>

        <div class="card result" id="result-download">
            <div id="platform-badge"></div>
            <video id="video-preview" controls playsinline style="display:none;"></video>
            <div id="image-list" class="image-grid"></div>
            <div id="media-info" class="info-box"></div>
            <div class="btn-group">
                <button class="btn-green" onclick="downloadFile(window.currentVideoUrl, 'huypham_video.mp4')">⬇️ Tải Video</button>
                <button class="btn-blue" onclick="copyLink(window.currentVideoUrl)">📋 Copy Link Video</button>
            </div>
            <div class="btn-group" style="margin-top:10px;">
                <button class="btn-red" onclick="downloadFile(window.currentImageUrl, 'huypham_image.jpg')">⬇️ Tải Ảnh</button>
                <button class="btn-orange" onclick="copyLink(window.currentImageUrl)">📋 Copy Link Ảnh</button>
            </div>
            <div class="btn-group" style="margin-top:10px;">
                <button class="btn-purple" onclick="downloadAllImages()">🖼️ Tải Tất Cả Ảnh</button>
                <button class="btn-blue" onclick="openOriginal()">🌐 Mở Link            Gốc</button>
            </div>
        </div>
    </div>

    <!-- TAB 2 -->
    <div class="tab-content" id="tab-batch">
        <div class="card">
            <h3>📁 Nhiều link (mỗi link 1 dòng)</h3>
            <textarea id="batch-input" rows="8" placeholder="https://www.instagram.com/p/abc/&#10;https://www.tiktok.com/@user/video/123&#10;https://www.facebook.com/..."></textarea>
            <button id="btn-batch" onclick="downloadBatch()">🚀 Tải Tất Cả</button>
 <div class="status" id="status-batch"></div>
        </div>
        <div class="card" id="batch-results" style="display:none;">
            <h3>📋 Kết quả</h3>
            <div id="batch-list"></div>
        </div>
    </div>

    <div class="info-box" style="margin-top:20px;text-align:center;font-size:12px;">
        © 2024 <strong>Huy Pham PRO</strong> · Made with ❤️
    </div>
</div>

<script>
// ==================== TABS ====================
function showTab(event, name) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    event.target.classList.add('active');
    document.getElementById('tab-' + name).classList.add('active');
}

function setStatus(id, msg, type) {
    const el = document.getElementById(id);
    el.textContent = msg;
    el.className = 'status show ' + type;
}

// ==================== PHÁT HIỆN NỀN TẢNG ====================
function detectPlatform(url) {
    if (url.includes('tiktok.com') || url.includes('vt.tiktok')) return 'tiktok';
    if (url.includes('instagram.com')) return 'instagram';
    if (url.includes('facebook.com') || url.includes('fb.watch')) return 'facebook';
    return 'unknown';
}

// ==================== HÀM TẢI CHÍNH ====================
async function downloadMedia() {
    const url = document.getElementById('url-input').value.trim();
    if (!url) { setStatus('status-download', '❌ Vui lòng nhập link!', 'error'); return; }

    const platform = detectPlatform(url);
    const btn = document.getElementById('btn-download');
    btn.disabled = true; btn.textContent = '⏳ Đang xử lý...';
    setStatus('status-download', `⏳ Đang lấy dữ liệu từ ${platform.toUpperCase()}...`, 'info');

    try {
        let data;
        if (platform === 'tiktok') data = await fetchTikTok(url);
        else if (platform === 'instagram') data = await fetchInstagram(url);
        else if (platform === 'facebook') data = await fetchFacebook(url);
        else throw new Error('Chỉ hỗ trợ TikTok, Instagram, Facebook');

        showResult(platform, data);
        setStatus('status-download', '✅ Lấy link thành công!', 'success');
    } catch (err) {
        setStatus('status-download', '❌ ' + err.message, 'error');
    } finally {
        btn.disabled = false; btn.textContent = '🚀 Tải Ngay';
    }
}

// ==================== API TIKTOK ====================
async function fetchTikTok(url) {
    const res = await fetch(`https://www.tikwm.com/api/?url=${encodeURIComponent(url)}`);
    const json = await res.json();
    if (json.code !== 0) throw new Error(json.msg || 'Không tải được TikTok');
    const d = json.data;
    return {
        title: d.title || 'Video TikTok',
        author: d.author?.unique_id || 'Unknown',
        videoUrl: d.play,
        imageUrl: d.cover,
        images: d.images || [],
        stats: `▶️ ${formatNum(d.play_count)} · ❤️ ${formatNum(d.digg_count)}`
    };
}

// ==================== API INSTAGRAM (đa proxy) ====================
async function fetchInstagram(url) {
    // Danh sách proxy + API dự phòng
    const endpoints = [
        // Cách 1: Dùng API snapinsta qua proxy
        async () => {
            const apiUrl = `https://snapinsta.app/action.php`;
            const formData = new FormData();
            formData.append('url', url);
            
            const res = await fetch(apiUrl, {
                method: 'POST',
                body: formData,
                headers: { 'User-Agent': 'Mozilla/5.0' }
            });
            const html = await res.text();
            return parseInstagramHtml(html);
        },
        
        // Cách 2: Dùng proxy allorigins + parse HTML Instagram
        async () => {
            const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;
            const res = await fetch(proxyUrl);
            const html = await res.text();
            return parseInstagramHtml(html);
        },
        
        // Cách 3: Dùng API saveinsta
        async () => {
            const apiUrl = `https://api.save-free.com/api/instagram?url=${encodeURIComponent(url)}`;
            const res = await fetch(apiUrl);
            const json = await res.json();
            if (json.data && json.data.length > 0) {
                return {
                    title: 'Instagram Post',
                    author: 'Instagram User',
                    videoUrl: json.data[0].video || null,
                    imageUrl: json.data[0].image || null,
                    images: json.data.map(d => d.image).filter(Boolean),
                    stats: '📷 Instagram'
                };
            }
            throw new Error('saveinsta không trả về dữ liệu');
        }
    ];

    let lastError = null;
    for (const fn of endpoints) {
        try {
            const result = await fn();
            if (result && (result.videoUrl || result.imageUrl || result.images?.length)) {
                return result;
            }
        } catch (e) {
            lastError = e;
        }
    }
    throw new Error('Không lấy được Instagram. Lỗi: ' + (lastError?.message || 'unknown'));
}

// Parse HTML từ Instagram để lấy link ảnh/video
function parseInstagramHtml(html) {
    // Tìm video
    let videoUrl = null;
    const videoPatterns = [
        /"video_url":"([^"]+)"/,
        /<meta property="og:video" content="([^"]+)"/,
        /"contentUrl":"([^"]+\.mp4[^"]*)"/
    ];
    for (const pattern of videoPatterns) {
        const match = html.match(pattern);
        if (match) { videoUrl = decodeUrl(match[1]); break; }
    }

    // Tìm ảnh chính
    let imageUrl = null;
    const imagePatterns = [
        /<meta property="og:image" content="([^"]+)"/,
        /"display_url":"([^"]+)"/
    ];
    for (const pattern of imagePatterns) {
        const match = html.match(pattern);
        if (match) { imageUrl = decodeUrl(match[1]); break; }
    }

    // Tìm tất cả ảnh (carousel)
    const images = [];
    const allImages = html.matchAll(/"display_url":"([^"]+)"/g);
    for (const m of allImages) {
        const img = decodeUrl(m[1]);
        if (!images.includes(img)) images.push(img);
    }

    // Tiêu đề
    const titleMatch = html.match(/<meta property="og:title" content="([^"]+)"/);

    if (!videoUrl && !imageUrl && images.length === 0) {
        throw new Error('Không tìm thấy media');
    }

    return {
        title: titleMatch ? titleMatch[1] : 'Instagram Post',
        author: 'Instagram',
        videoUrl: videoUrl,
        imageUrl: imageUrl || images[0],
        images: images,
        stats: '📷 Instagram · ' + (videoUrl ? 'Video' : 'Ảnh')
    };
}

function decodeUrl(str) {
    return str
        .replace(/\\u0026/g, '&')
        .replace(/\\u003D/g, '=')
        .replace(/\\/g, '')
        .replace(/&amp;/g, '&');
}

// ==================== API FACEBOOK ====================
async function fetchFacebook(url) {
    const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;
    const res = await fetch(proxyUrl);
    const html = await res.text();

    const hdMatch = html.match(/"hd_src":"([^"]+)"/);
    const sdMatch = html.match(/"sd_src":"([^"]+)"/);
    const imgMatch = html.match(/"preview_image_url":"([^"]+)"/);
    const titleMatch = html.match(/<title>([^<]+)<\/title>/);

    let videoUrl = null;
    if (hdMatch) videoUrl = decodeUrl(hdMatch[1]);
    else if (sdMatch) videoUrl = decodeUrl(sdMatch[1]);

    if (!videoUrl && !imgMatch) throw new Error('Không tìm thấy media Facebook');

    return {
        title: titleMatch ? titleMatch[1] : 'Facebook Media',
        author: 'Facebook User',
        videoUrl: videoUrl,
        imageUrl: imgMatch ? decodeUrl(imgMatch[1]) : null,
        images: [],
        stats: '📘 Facebook'
    };
}

// ==================== HIỂN THỊ ====================
function showResult(platform, data) {
    const badges = {
        tiktok: { text: '🎵 TikTok', cls: 'badge-tiktok' },
        instagram: { text: '📷 Instagram', cls: 'badge-instagram' },
        facebook: { text: '📘 Facebook', cls: 'badge-facebook' }
    };
    const b = badges[platform];
    document.getElementById('platform-badge').innerHTML = `<span class="platform-badge ${b.cls}">${b.text}</span>`;

    // Video
    const video = document.getElementById('video-preview');
    if (data.videoUrl) {
        video.src = data.videoUrl;
        video.style.display = 'block';
    } else {
        video.style.display = 'none';
    }

    // Ảnh
    const imageList = document.getElementById('image-list');
    if (data.images && data.images.length > 0) {
        imageList.innerHTML = data.images.map((img, i) => `
            <img src="${img}" onclick="downloadFile('${img}', 'huypham_img_${i+1}.jpg')">
        `).join('');
    } else if (data.imageUrl) {
        imageList.innerHTML = `<img src="${data.imageUrl}" onclick="downloadFile('${data.imageUrl}', 'huypham_image.jpg')">`;
    } else {
        imageList.innerHTML = '';
    }

    document.getElementById('media-info').innerHTML = `
        <strong>📝 ${data.title}</strong><br>
        👤 ${data.author}<br>
        ${data.stats}
    `;

    window.currentVideoUrl = data.videoUrl;
    window.currentImageUrl = data.imageUrl;
    window.currentImages = data.images || [];
    window.currentOriginalUrl = document.getElementById('url-input').value;

    document.getElementById('result-download').classList.add('show');
}

// ==================== TẢI NHIỀU LINK ====================
async function downloadBatch() {
    const input = document.getElementById('batch-input').value.trim();
    if (!input) { setStatus('status-batch', '❌ Vui lòng nhập link!', 'error'); return; }

    const links = input.split('\n').map(l => l.trim()).filter(l => l);
    const btn = document.getElementById('btn-batch');
    btn.disabled = true; btn.textContent = '⏳ Đang xử lý...';

    document.getElementById('batch-results').style.display = 'block';
    const list = document.getElementById('batch-list');
    list.innerHTML = '';

    let success = 0, fail = 0;

    for (let i = 0; i < links.length; i++) {
        const link = links[i];
        setStatus('status-batch', `⏳ ${i+1}/${links.length}...`, 'info');

        try {
            const platform = detectPlatform(link);
            let data;
            if (platform === 'tiktok') data = await fetchTikTok(link);
            else if (platform === 'instagram') data = await fetchInstagram(link);
            else if (platform === 'facebook') data = await fetchFacebook(link);
            else throw new Error('Nền tảng không hỗ trợ');

            list.innerHTML += `
                <div class="info-box" style="border-left-color:#22c55e;">
                    <strong>✅ ${data.title}</strong><br>
                    👤 ${data.author}<br>
                    <div class="btn-group" style="margin-top:8px;">
                        ${data.videoUrl ? `<button class="btn-green" onclick="downloadFile('${data.videoUrl}', 'video_${i+1}.mp4')">⬇️ Video</button>` : ''}
                        ${data.imageUrl ? `<button class="btn-red" onclick="downloadFile('${data.imageUrl}', 'img_${i+1}.jpg')">⬇️ Ảnh</button>` : ''}
                    </div>
                </div>
            `;
            success++;
        } catch (err) {
            list.innerHTML += `
                <div class="info-box" style="border-left-color:#ef4444;">
                    <strong>❌ ${link.substring(0, 50)}...</strong><br>
                    <span style="color:#fca5a5;font-size:12px;">${err.message}</span>
                </div>
            `;
            fail++;
        }
    }

    setStatus('status-batch', `✅ Hoàn tất! ${success} thành công, ${fail} lỗi`, 'success');
    btn.disabled = false; btn.textContent = '🚀 Tải Tất Cả';
}

// ==================== HELPERS ====================
function downloadFile(url, filename) {
    if (!url) return alert('Chưa có file!');
    const a = document.createElement('a');
    a.href = url;
    a.download = filename || 'huypham_file';
    a.target = '_blank';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
}

function downloadAllImages() {
    if (!window.currentImages || window.currentImages.length === 0) {
        return alert('Không có ảnh để tải!');
    }
    window.currentImages.forEach((img, i) => {
        setTimeout(() => downloadFile(img, `huypham_img_${i+1}.jpg`), i * 500);
    });
}

function copyLink(url) {
    if (!url) return alert('Chưa có link!');
    navigator.clipboard.writeText(url).then(() => alert('✅ Đã copy: ' + url));
}

function openOriginal() {
    if (window.currentOriginalUrl) window.open(window.currentOriginalUrl, '_blank');
}

function formatNum(n) {
    if (!n) return '0';
    if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
    if (n >= 1000) return (n / 1000).toFixed(1) + 'K';
    return n.toString();
}
</script>
</body>
</html>
