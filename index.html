<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Huy Pham PRO - Tải Ảnh & Video</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #0a0a0a, #1a1a2e);
    color: #fff;
    min-height: 100vh;
    padding: 20px;
}
.container { max-width: 700px; margin: 0 auto; }
h1 {
    text-align: center;
    font-size: 2.2em;
    background: linear-gradient(135deg, #f59e0b, #d97706);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 5px;
}
.subtitle { text-align: center; color: #888; margin-bottom: 20px; font-size: 0.9em; }
.card {
    background: #1e1e2e;
    border-radius: 16px;
    padding: 25px;
    margin-bottom: 20px;
    border: 1px solid #333;
}
h3 { margin-bottom: 15px; font-size: 1.1em; }
input, textarea {
    width: 100%;
    padding: 14px;
    background: #2d2d3d;
    border: 2px solid #444;
    border-radius: 10px;
    color: #fff;
    font-size: 16px;
    margin-bottom: 12px;
    font-family: inherit;
}
input:focus, textarea:focus { outline: none; border-color: #8b5cf6; }
button {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #8b5cf6, #d946ef);
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s;
}
button:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(139,92,246,0.3); }
button:disabled { opacity: 0.5; cursor: not-allowed; }
.result {
    margin-top: 15px;
    padding: 20px;
    background: #2d2d3d;
    border-radius: 12px;
    display: none;
}
.result.show { display: block; }
video {
    width: 100%;
    border-radius: 10px;
    margin: 10px 0;
    max-height: 500px;
    background: #000;
}
.media-item {
    background: #1a1a2e;
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 12px;
    border: 1px solid #333;
}
.media-item img, .media-item video {
    width: 100%;
    border-radius: 8px;
    margin-bottom: 10px;
    max-height: 400px;
    object-fit: contain;
    background: #000;
}
.btn-group {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 10px;
}
.btn-green { background: #22c55e; }
.btn-blue { background: #3b82f6; }
.btn-red { background: #ef4444; }
.btn-orange { background: #f59e0b; }
.btn-purple { background: #8b5cf6; }
.platform-badge {
    display: inline-block;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 700;
    margin-bottom: 10px;
}
.badge-tiktok { background: linear-gradient(135deg, #25f4ee, #fe2c55); }
.badge-instagram { background: linear-gradient(135deg, #f58529, #dd2a7b, #8134af); }
.badge-facebook { background: #1877f2; }
.badge-unknown { background: #666; }
.status {
    padding: 12px;
    border-radius: 8px;
    margin-top: 12px;
    font-size: 14px;
    display: none;
}
.status.show { display: block; }
.status.info { background: #1e3a5f; color: #93c5fd; }
.status.error { background: #450a0a; color: #fca5a5; }
.status.success { background: #052e16; color: #86efac; }
.info-box {
    background: #1a1a2e;
    border-radius: 12px;
    padding: 15px;
    margin-bottom: 15px;
    border-left: 4px solid #8b5cf6;
    font-size: 13px;
    color: #aaa;
    line-height: 1.6;
}
.platforms {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-bottom: 20px;
    flex-wrap: wrap;
}
.platform-chip {
    padding: 8px 14px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    background: #2d2d3d;
    border: 1px solid #444;
}
</style>
</head>
<body>
<div class="container">
    <h1>👑 HUY PHAM PRO</h1>
    <p class="subtitle">Tải Ảnh & Video Đa Nền Tảng</p>

    <div class="platforms">
        <span class="platform-chip">🎵 TikTok</span>
        <span class="platform-chip">📷 Instagram</span>
        <span class="platform-chip">📘 Facebook</span>
    </div>

    <div class="card">
        <h3>🔗 Dán link (ảnh hoặc video)</h3>
        <div class="info-box">
            💡 Dán link Instagram/TikTok/Facebook → Bấm tải → Tất cả ảnh & video sẽ hiện xuống bên dưới.
        </div>
        <input type="url" id="url-input" placeholder="https://www.instagram.com/p/... hoặc /reel/...">
        <button id="btn-download" onclick="downloadMedia()">🚀 Lấy Tất Cả Ảnh & Video</button>
        <div class="status" id="status-download"></div>
    </div>

    <div class="card result" id="result-download">
        <div id="platform-badge"></div>
        <div id="media-info" class="info-box"></div>
        <h3>📥 Danh sách media (${''})</h3>
        <div id="media-list"></div>
    </div>

    <div class="info-box" style="margin-top:20px;text-align:center;font-size:12px;">
        © 2024 <strong>Huy Pham PRO</strong> · Made with ❤️
    </div>
</div>

<script>
function setStatus(id, msg, type) {
    const el = document.getElementById(id);
    el.textContent = msg;
    el.className = 'status show ' + type;
}

function detectPlatform(url) {
    if (url.includes('tiktok.com') || url.includes('vt.tiktok')) return 'tiktok';
    if (url.includes('instagram.com')) return 'instagram';
    if (url.includes('facebook.com') || url.includes('fb.watch')) return 'facebook';
    return 'unknown';
}

// ==================== TẢI CHÍNH ====================
async function downloadMedia() {
    const url = document.getElementById('url-input').value.trim();
    if (!url) { setStatus('status-download', '❌ Vui lòng nhập link!', 'error'); return; }

    const platform = detectPlatform(url);
    const btn = document.getElementById('btn-download');
    btn.disabled = true; btn.textContent = '⏳ Đang xử lý...';
    setStatus('status-download', `⏳ Đang lấy dữ liệu...`, 'info');

    try {
        let result;
        if (platform === 'tiktok') result = await fetchTikTok(url);
        else if (platform === 'instagram') result = await fetchInstagram(url);
        else if (platform === 'facebook') result = await fetchFacebook(url);
        else throw new Error('Chỉ hỗ trợ TikTok, Instagram, Facebook');

        renderResult(platform, result);
        setStatus('status-download', `✅ Tìm thấy ${result.media.length} media!`, 'success');
    } catch (err) {
        setStatus('status-download', '❌ ' + err.message, 'error');
    } finally {
        btn.disabled = false; btn.textContent = '🚀 Lấy Tất Cả Ảnh & Video';
    }
}

// ==================== TIKTOK ====================
async function fetchTikTok(url) {
    const res = await fetch(`https://www.tikwm.com/api/?url=${encodeURIComponent(url)}`);
    const json = await res.json();
    if (json.code !== 0) throw new Error(json.msg || 'Không tải được TikTok');
    
    const d = json.data;
    const media = [];
    if (d.play) media.push({ type: 'video', url: d.play, thumb: d.cover });
    if (d.images && d.images.length > 0) {
        d.images.forEach(img => media.push({ type: 'image', url: img }));
    } else if (d.cover) {
        media.push({ type: 'image', url: d.cover });
    }
    
    return {
        title: d.title || 'Video TikTok',
        author: d.author?.unique_id || 'Unknown',
        media: media
    };
}

// ==================== INSTAGRAM (nhiều API dự phòng) ====================
async function fetchInstagram(url) {
    // Chuẩn hoá link
    const cleanUrl = url.split('?')[0].replace(/\/$/, '') + '/';

    // Danh sách API dự phòng (dùng proxy CORS)
    const APIs = [
        // API 1: Instagram Save (qua corsproxy)
        async () => {
            const apiUrl = `https://api.cobalt.tools/api/json`;
            const res = await fetch(apiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                body: JSON.stringify({ url: cleanUrl, vQuality: '720' })
            });
            const data = await res.json();
            if (data.status === 'stream' || data.status === 'redirect') {
                return [{ type: 'video', url: data.url }];
            }
            if (data.status === 'picker' && data.picker) {
                return data.picker.map(p => ({ type: p.type === 'video' ? 'video' : 'image', url: p.url }));
            }
            throw new Error('cobalt không trả về dữ liệu');
        },

        // API 2: Instagram qua snapinsta proxy
        async () => {
            const formData = new URLSearchParams();
            formData.append('url', cleanUrl);
            const res = await fetch('https://snapinsta.app/action.php', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                    'User-Agent': 'Mozilla/5.0'
                },
                body: formData.toString()
            });
            const html = await res.text();
            return parseInstagramHtml(html);
        },

        // API 3: Instagram qua allorigins
        async () => {
            const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(cleanUrl)}`;
            const res = await fetch(proxyUrl);
            const html = await res.text();
            return parseInstagramHtml(html);
        }
    ];

    let lastError = null;
    for (const fn of APIs) {
        try {
            const media = await fn();
            if (media && media.length > 0) {
                return {
                    title: 'Instagram Post',
                    author: 'Instagram User',
                    media: media
                };
            }
        } catch (e) {
            lastError = e;
        }
    }
    throw new Error('Không lấy được Instagram. ' + (lastError?.message || ''));
}

function parseInstagramHtml(html) {
    const media = [];

    // Video
    const videoPatterns = [
        /"video_url":"([^"]+)"/g,
        /<meta property="og:video" content="([^"]+)"/g,
        /"contentUrl":"([^"]+\.mp4[^"]*?)"/g
    ];
    for (const pattern of videoPatterns) {
        const matches = [...html.matchAll(pattern)];
        for (const m of matches) {
            const url = decodeUrl(m[1]);
            if (url && !media.find(x => x.url === url)) {
                media.push({ type: 'video', url });
            }
        }
    }

    // Ảnh - lấy tất cả display_url
    const imgMatches = [...html.matchAll(/"display_url":"([^"]+)"/g)];
    for (const m of imgMatches) {
        const url = decodeUrl(m[1]);
        if (url && !media.find(x => x.url === url)) {
            media.push({ type: 'image', url });
        }
    }

    // Ảnh từ og:image (dự phòng)
    if (media.length === 0) {
        const ogImg = html.match(/<meta property="og:image" content="([^"]+)"/);
        if (ogImg) media.push({ type: 'image', url: decodeUrl(ogImg[1]) });
    }

    return media;
}

function decodeUrl(str) {
    return str
        .replace(/\\u0026/g, '&')
        .replace(/\\u003D/g, '=')
        .replace(/\\u002F/g, '/')
        .replace(/\\/g, '')
        .replace(/&amp;/g, '&');
}

// ==================== FACEBOOK ====================
async function fetchFacebook(url) {
    const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;
    const res = await fetch(proxyUrl);
    const html = await res.text();

    const media = [];
    const hdMatch = html.match(/"hd_src":"([^"]+)"/);
    const sdMatch = html.match(/"sd_src":"([^"]+)"/);
    const imgMatch = html.match(/"preview_image_url":"([^"]+)"/);

    if (hdMatch) media.push({ type: 'video', url: decodeUrl(hdMatch[1]) });
    else if (sdMatch) media.push({ type: 'video', url: decodeUrl(sdMatch[1]) });
    if (imgMatch) media.push({ type: 'image', url: decodeUrl(imgMatch[1]) });

    if (media.length === 0) throw new Error('Không tìm thấy media Facebook');

    return {
        title: 'Facebook Media',
        author: 'Facebook User',
        media: media
    };
}

// ==================== HIỂN THỊ TẤT CẢ MEDIA ====================
function renderResult(platform, result) {
    const badges = {
        tiktok: { text: '🎵 TikTok', cls: 'badge-tiktok' },
        instagram: { text: '📷 Instagram', cls: 'badge-instagram' },
        facebook: { text: '📘 Facebook', cls: 'badge-facebook' }
    };
    const b = badges[platform];
    document.getElementById('platform-badge').innerHTML = `<span class="platform-badge ${b.cls}">${b.text}</span>`;

    document.getElementById('media-info').innerHTML = `
        <strong>📝 ${result.title}</strong><br>
        👤 ${result.author}<br>
        📦 Tổng: <strong>${result.media.length}</strong> media
    `;

    const list = document.getElementById('media-list');
    list.innerHTML = '';

    result.media.forEach((item, i) => {
        const div = document.createElement('div');
        div.className = 'media-item';

        if (item.type === 'video') {
            div.innerHTML = `
                <div style="font-size:12px;color:#8b5cf6;font-weight:600;margin-bottom:8px;">🎬 Video ${i + 1}</div>
                <video controls playsinline preload="metadata" src="${item.url}"></video>
                <div class="btn-group">
                    <button class="btn-green" onclick="downloadFile('${item.url}', 'huypham_video_${i + 1}.mp4')">⬇️ Tải Video</button>
                    <button class="btn-blue" onclick="copyLink('${item.url}')">📋 Copy Link</button>
                </div>
            `;
        } else {
            div.innerHTML = `
                <div style="font-size:12px;color:#22c55e;font-weight:600;margin-bottom:8px;">🖼️ Ảnh ${i + 1}</div>
                <img src="${item.url}" loading="lazy" onerror="this.style.display='none'">
                <div class="btn-group">
                    <button class="btn-green" onclick="downloadFile('${item.url}', 'huypham_image_${i + 1}.jpg')">⬇️ Tải Ảnh</button>
                    <button class="btn-blue" onclick="copyLink('${item.url}')">📋 Copy Link</button>
                </div>
            `;
        }
        list.appendChild(div);
    });

    document.getElementById('result-download').classList.add('show');
}

// ==================== HELPERS ====================
function downloadFile(url, filename) {
    if (!url) return alert('Chưa có file!');
    
    // Dùng fetch để tải qua blob (vượt CORS)
    fetch(url, { mode: 'cors' })
        .then(res => res.blob())
        .then(blob => {
            const blobUrl = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = blobUrl;
            a.download = filename || 'huypham_file';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(blobUrl), 3000);
        })
        .catch(() => {
            // Fallback mở tab mới nếu CORS chặn
            window.open(url, '_blank');
        });
}

function copyLink(url) {
    if (!url) return alert('Chưa có link!');
    navigator.clipboard.writeText(url).then(() => alert('✅ Đã copy link!'));
}
</script>
</body>
</html>
