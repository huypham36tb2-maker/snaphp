<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HUY PHAM Tool - Buff View TikTok</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #0f0f0f, #1a1a2e, #16213e);
            min-height: 100vh;
            color: #fff;
            overflow-x: hidden;
        }
        
        .banner {
            text-align: center;
            padding: 20px;
            background: linear-gradient(45deg, #ff6b6b, #ffa500, #4ecdc4);
            background-size: 200% 200%;
            animation: gradient 3s ease infinite;
            border-radius: 10px;
            margin: 20px;
            box-shadow: 0 0 30px rgba(255,107,107,0.5);
        }
        
        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .input-group {
            margin: 20px 0;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #ffa500;
            font-weight: bold;
            font-size: 14px;
        }
        
        input[type="text"] {
            width: 100%;
            padding: 12px;
            background: rgba(0,0,0,0.5);
            border: 1px solid #ff6b6b;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            margin-bottom: 15px;
            transition: all 0.3s;
        }
        
        input[type="text"]:focus {
            outline: none;
            border-color: #4ecdc4;
            box-shadow: 0 0 15px rgba(78,205,196,0.3);
        }
        
        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s;
            margin: 5px;
        }
        
        .btn-start {
            background: linear-gradient(45deg, #ff6b6b, #ffa500);
            color: #fff;
        }
        
        .btn-start:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(255,107,107,0.5);
        }
        
        .btn-stop {
            background: linear-gradient(45deg, #6b6b6b, #333);
            color: #fff;
        }
        
        .btn-stop:hover {
            background: linear-gradient(45deg, #555, #222);
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin: 20px 0;
        }
        
        .stat-card {
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.2);
        }
        
        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #4ecdc4;
        }
        
        .stat-label {
            font-size: 12px;
            color: #aaa;
            margin-top: 5px;
        }
        
        .log-container {
            background: rgba(0,0,0,0.7);
            border-radius: 10px;
            padding: 15px;
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid #ff6b6b;
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }
        
        .log-entry {
            padding: 5px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .success {
            color: #4ecdc4;
        }
        
        .error {
            color: #ff6b6b;
        }
        
        .info {
            color: #ffa500;
        }
        
        .proxy-section {
            margin: 20px 0;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.2);
        }
        
        .checkbox-wrapper {
            display: flex;
            align-items: center;
            margin: 10px 0;
        }
        
        .checkbox-wrapper input {
            margin-right: 10px;
        }
        
        select {
            padding: 8px;
            background: rgba(0,0,0,0.5);
            border: 1px solid #ff6b6b;
            border-radius: 8px;
            color: #fff;
            margin: 5px 0;
        }
        
        .status-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.9);
            padding: 10px;
            text-align: center;
            border-top: 2px solid #ff6b6b;
            z-index: 100;
        }
        
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            margin-right: 10px;
            vertical-align: middle;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        @media (max-width: 768px) {
            .stats {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .container {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="banner">
        <h1>🔥 HUY PHAM TOOL - BUFF VIEW TIKTOK 🔥</h1>
        <p style="color: #fff; font-size: 12px; margin-top: 10px;">Tool bán view video TikTok tự động | Web Version</p>
    </div>
    
    <div class="container">
        <div class="input-group">
            <label>🔗 LINK VIDEO TIKTOK:</label>
            <input type="text" id="videoLink" placeholder="Dán link video TikTok vào đây...">
            <div style="display: flex; gap: 10px; justify-content: center;">
                <button class="btn btn-start" onclick="startTool()">🚀 BẮT ĐẦU</button>
                <button class="btn btn-stop" onclick="stopTool()">⏹ DỪNG</button>
            </div>
        </div>
        
        <div class="proxy-section">
            <h3 style="color: #ffa500; margin-bottom: 15px;">⚙️ CẤU HÌNH PROXY</h3>
            <div class="checkbox-wrapper">
                <input type="checkbox" id="useProxy">
                <label for="useProxy" style="color: #fff; margin: 0;">Sử dụng Proxy</label>
            </div>
            <label>Loại Proxy:</label>
            <select id="proxyType">
                <option value="http">HTTP</option>
                <option value="socks4">SOCKS4</option>
                <option value="socks5">SOCKS5</option>
            </select>
            <label>Credential (nếu có):</label>
            <input type="text" id="proxyCredential" placeholder="user:pass">
        </div>
        
        <div class="stats">
            <div class="stat-card">
                <div class="stat-value" id="totalReqs">0</div>
                <div class="stat-label">Tổng Request</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="successCount">0</div>
                <div class="stat-label">Thành Công</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="failCount">0</div>
                <div class="stat-label">Thất Bại</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="rps">0</div>
                <div class="stat-label">Req/Sec</div>
            </div>
        </div>
        
        <div class="log-container" id="logContainer">
            <div class="log-entry info">[HUY PHAM TOOL] Sẵn sàng hoạt động...</div>
        </div>
    </div>
    
    <div class="status-bar" id="statusBar">
        <span id="statusText">⏸ DỪNG</span>
    </div>
    
    <script>
        // HUY PHAM Tool - Logic JavaScript
        let running = false;
        let totalReqs = 0;
        let successCount = 0;
        let failCount = 0;
        let rps = 0;
        let startTime = 0;
        let maxWorkers = 50;
        let workerIntervals = [];
        
        const DOMAINS = [
            'api22-core-c-useast1a.tiktokv.com',
            'api19-core-c-useast1a.tiktokv.com',
            'api16-core-c-useast1a.tiktokv.com',
            'api21-core-c-useast1a.tiktokv.com'
        ];
        
        const DEVICES = [
            'SM-G9900', 'SM-A136U1', 'SM-M225FV', 'SM-E426B',
            'SM-M526BR', 'SM-M326B', 'SM-A528B', 'SM-F711B',
            'SM-F926B', 'SM-A037G', 'SM-A225F', 'SM-M325FV',
            'SM-A226B', 'SM-M426B', 'SM-A525F', 'SM-N976N'
        ];
        
        // Hàm trích xuất ID video - KHÔNG cần resolve, parse trực tiếp
        function extractVideoId(link) {
            // 1. Thử tìm số 18-19 chữ số trực tiếp
            let match = link.match(/(\d{18,19})/);
            if (match) return match[0];
            
            // 2. Thử tìm số 15-20 chữ số (mở rộng hơn)
            match = link.match(/(\d{15,20})/);
            if (match) return match[0];
            
            // 3. Nếu là link rút gọn vt.tiktok.com, lấy phần sau dấu /
            // vd: https://vt.tiktok.com/ZSqjkTMHk/ -> không có ID số
            // Nhưng chúng ta sẽ cố gắng lấy từ URL đầy đủ
            if (link.includes('tiktok.com')) {
                // Thử tìm ID từ đường dẫn /video/ hoặc /@user/video/
                match = link.match(/\/video\/(\d+)/);
                if (match) return match[0];
                
                // Thử tìm ID từ /@user/video/
                match = link.match(/@[^/]+\/video\/(\d+)/);
                if (match) return match[0];
            }
            
            // 4. Fallback cuối cùng: nếu link rút gọn, yêu cầu mở link gốc
            // Trong môi trường browser, không thể resolve CORS, nên báo lỗi rõ ràng
            throw new Error('Không tìm thấy ID video. Vui lòng mở link gốc (bỏ vt.tiktok.com) và dán lại.');
        }
        
        function generateDeviceId() {
            return Math.floor(1000000000000000000 + Math.random() * 9000000000000000000).toString();
        }
        
        function generateInstallId() {
            return Math.floor(1000000000000000000 + Math.random() * 9000000000000000000).toString();
        }
        
        function generateParams() {
            const version = Math.floor(Math.random() * 10);
            return `os_api=25&device_type=${DEVICES[Math.floor(Math.random() * DEVICES.length)]}&ssmix=a&manifest_version_code=190303&dpi=240&region=VN&carrier_region=VN&app_name=musically_go&version_name=27.2.4&timezone_offset=-28800&ab_version=27.2.4&ac2=wifi&ac=wifi&app_type=normal&channel=googleplay&update_version_code=190303&device_platform=android&iid=${generateInstallId()}&build_number=27.2.4&locale=vi&op_region=VN&version_code=190303&timezone_name=Asia%2FHo_Chi_Minh&device_id=${generateDeviceId()}&sys_region=VN&app_language=vi&resolution=720*1280&device_brand=samsung&language=vi&os_version=7.1.2&aid=1340`;
        }
        
        async function sendRequest(videoId) {
            if (!running) return;
            
            const params = generateParams();
            const payload = `item_id=${videoId}&play_delta=1`;
            const unix = Math.floor(Date.now() / 1000);
            
            const domain = DOMAINS[Math.floor(Math.random() * DOMAINS.length)];
            const url = `https://${domain}/aweme/v1/aweme/stats/?${params}`;
            
            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                        'User-Agent': 'com.zhiliaoapp.musically/2022405030 (Linux; U; Android 12; vi_VN; SM-G9900; Build/TP1A.220624.014; Cronet/58.0.2991.0)',
                        'X-Gorgon': '0404b0d30000' + Math.random().toString(16).slice(2, 34),
                        'X-Khronos': unix.toString(),
                        'Cookie': 'sessionid=90c38a59d8076ea0fbc01c8643efbe47'
                    },
                    body: payload,
                    mode: 'no-cors'
                });
                
                totalReqs++;
                successCount++;
                addLog(`✅ Thành công +1 View`, 'success');
            } catch (error) {
                totalReqs++;
                failCount++;
                addLog(`❌ Lỗi request`, 'error');
            }
        }
        
        function addLog(message, type) {
            const logContainer = document.getElementById('logContainer');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logContainer.appendChild(entry);
            logContainer.scrollTop = logContainer.scrollHeight;
            
            while (logContainer.children.length > 100) {
                logContainer.removeChild(logContainer.firstChild);
            }
        }
        
        function updateStats() {
            document.getElementById('totalReqs').textContent = totalReqs;
            document.getElementById('successCount').textContent = successCount;
            document.getElementById('failCount').textContent = failCount;
            document.getElementById('rps').textContent = rps.toFixed(1);
        }
        
        async function startTool() {
            const link = document.getElementById('videoLink').value.trim();
            if (!link) {
                addLog('⚠️ Vui lòng nhập link video TikTok', 'error');
                return;
            }
            
            addLog('⏳ Đang xử lý link...', 'info');
            
            let videoId;
            try {
                videoId = extractVideoId(link);
                addLog(`✅ Đã tìm thấy video ID: ${videoId}`, 'success');
            } catch (error) {
                addLog(`❌ ${error.message}`, 'error');
                return;
            }
            
            running = true;
            startTime = Date.now();
            document.getElementById('statusText').innerHTML = '<span class="spinner"></span> ĐANG CHẠY';
            addLog(`🚀 Bắt đầu buff view cho video: ${videoId}`, 'info');
            
            // Dọn các interval cũ
            workerIntervals.forEach(clearInterval);
            workerIntervals = [];
            
            // Tạo worker threads
            for (let i = 0; i < maxWorkers; i++) {
                const interval = setInterval(() => {
                    sendRequest(videoId);
                }, 100 + Math.random() * 200);
                workerIntervals.push(interval);
            }
            
            // Update RPS loop
            if (this.rpsInterval) clearInterval(this.rpsInterval);
            this.rpsInterval = setInterval(() => {
                const elapsed = (Date.now() - startTime) / 1000;
                rps = totalReqs / elapsed;
                updateStats();
            }, 1000);
        }
        
        function stopTool() {
            running = false;
            workerIntervals.forEach(clearInterval);
            workerIntervals = [];
            if (this.rpsInterval) clearInterval(this.rpsInterval);
            document.getElementById('statusText').textContent = '⏸ ĐÃ DỪNG';
            addLog('⏹ Đã dừng tool', 'info');
        }
        
        // Show banner on load
        addLog('🔥 HUY PHAM TOOL - Sẵn sàng hoạt động', 'info');
        addLog('📌 Nhập link video và bấm BẮT ĐẦU', 'info');
        addLog('💡 Mẹo: Nếu link rút gọn lỗi, hãy mở video trên TikTok, copy link gốc (có số ở cuối) rồi dán vào đây.', 'info');
    </script>
</body>
</html>
